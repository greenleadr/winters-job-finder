name: Daily Job Digest

on:
  schedule:
    # 7 AM Pacific = 2 PM UTC
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run job finder pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          BREVO_SMTP_LOGIN: ${{ secrets.BREVO_SMTP_LOGIN }}
          BREVO_SMTP_KEY: ${{ secrets.BREVO_SMTP_KEY }}
          BREVO_SENDER: ${{ secrets.BREVO_SENDER }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: python main.py

      - name: Commit jobs database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force data/jobs.db
          git diff --cached --quiet && echo "No DB changes to commit" || \
            git commit -m "chore: update jobs.db [skip ci]" && git push

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-output
          path: output/
          if-no-files-found: ignore
          retention-days: 14
