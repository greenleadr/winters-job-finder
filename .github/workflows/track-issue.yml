name: Process Tracking Issue

on:
  issues:
    types: [opened]

concurrency:
  group: tracking-updates
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  process-issue:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, '[TRACK]') || startsWith(github.event.issue.title, '[FEEDBACK]') || startsWith(github.event.issue.title, '[FAVORITE]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Process issue
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python process_issue.py

      - name: Regenerate dashboard
        run: python dashboard.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force data/tracking.db
          git add docs/index.html
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: process issue #${{ github.event.issue.number }} [skip ci]" && git push

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Processed and dashboard updated.'
            });

  deploy-pages:
    needs: process-issue
    runs-on: ubuntu-latest
    if: always() && needs.process-issue.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest
        run: git pull origin main || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
